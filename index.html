<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWave - Modern Ecommerce</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; }
        header { background: #1a1a1a; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #6366f1; }
        .cart-btn { background: #6366f1; color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .cart-btn:hover { background: #4f46e5; }
        .cart-count { background: #ef4444; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }
        main { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .product { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: transform 0.2s; cursor: pointer; }
        .product:hover { transform: translateY(-5px); border-color: #6366f1; }
        .product img { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 1rem; }
        .product h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }
        .product p { color: #999; font-size: 0.9rem; margin-bottom: 1rem; }
        .product .price { font-size: 1.5rem; font-weight: bold; color: #6366f1; }
        .add-btn { width: 100%; background: #6366f1; color: white; border: none; padding: 0.75rem; border-radius: 8px; cursor: pointer; margin-top: 1rem; font-size: 1rem; }
        .add-btn:hover { background: #4f46e5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a1a; padding: 2rem; border-radius: 12px; max-width: 500px; width: 90%; position: relative; }
        .close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .cart-items { max-height: 300px; overflow-y: auto; margin: 1rem 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #333; }
        .cart-total { font-size: 1.5rem; font-weight: bold; text-align: right; margin-top: 1rem; }
        .checkout-btn { width: 100%; background: #10b981; color: white; border: none; padding: 1rem; border-radius: 8px; cursor: pointer; margin-top: 1rem; font-size: 1rem; }
        .checkout-btn:hover { background: #059669; }
        .empty-cart { text-align: center; color: #999; padding: 2rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🛒 ShopWave</div>
        <button class="cart-btn" onclick="openCart()">
            🛍️ <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <main>
        <div class="products" id="products"></div>
    </main>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <button class="close" onclick="closeCart()">×</button>
            <h2>Your Cart</h2>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total" id="cartTotal">$0.00</div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <script>
        let products = [];
        let cart = [];

        async function loadProducts() {
            try {
                const response = await fetch('products.json');
                products = await response.json();
                renderProducts();
            } catch (error) {
                console.error('Failed to load products:', error);
            }
        }

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = products.map(p => `
                <div class="product">
                    <img src="${p.image}" alt="${p.name}">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.description}</p>
                        <div class="price">$${p.price.toFixed(2)}</div>
                        <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function openCart() {
            const modal = document.getElementById('cartModal');
            const itemsContainer = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
                totalEl.textContent = '$0.00';
            } else {
                itemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <small>$${item.price.toFixed(2)} × ${item.quantity}</small>
                        </div>
                        <span>$${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                `).join('');
                const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
                totalEl.textContent = `$${total.toFixed(2)}`;
            }

            modal.classList.add('active');
        }

        function closeCart() {
            document.getElementById('cartModal').classList.remove('active');
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            alert('🎉 Order placed successfully! Thanks for shopping with ShopWave.');
            cart = [];
            updateCartUI();
            closeCart();
        }

        loadProducts();
    </script>
</body>
</html>
